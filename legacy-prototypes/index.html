function translateText(text){if(language==='zh')return text;if(translations[text])return translations[text];let out=text;const keys=Object.keys(translations).filter(k=>k.length>2).sort((a,b)=>b.length-a.length);const re=new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');return out.replace(re,k=>translations[k]);}

const KEY='lifechain-first-review-v1';
const seedNote='I was researching address A and noticed transfers to several recipients. Perhaps the recipient set was expanding, but a few transactions were inconclusive and ownership remained unknown, so I paused. I want to see whether the pattern continues.';
const rows=[{id:'demo-01',hour:8,to:'B',eth:5},{id:'demo-02',hour:9,to:'C',eth:3},{id:'demo-03',hour:12,to:'B',eth:2},{id:'demo-04',hour:13,to:'D',eth:1},{id:'demo-05',hour:14,to:'E',eth:2},{id:'demo-06',hour:15,to:'D',eth:1},{id:'demo-07',hour:16,to:'B',eth:1,failed:true},{id:'demo-08',hour:17,to:'E',eth:1}];
const initial=()=>({stage:0,note:seedNote,stance:'Paused: evidence is inconclusive',reason:'Activity is sparse; recipient ownership remains unknown',focus:'expand',k:2,min:0,window:6,cursor:0,memory:true,check:null,reviews:[]});
let s=initial(),storageOK=true;try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.schema===1)s={...initial(),...saved.state};}catch(e){storageOK=false}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify({schema:1,state:s}));}catch(e){storageOK=false}document.getElementById('storage').textContent=storageOK?'本浏览器自动保存 · 刷新可恢复 · 无数据上传':'浏览器存储不可用：本次仍可操作，但刷新后可能丢失。';localize()}

function valid(t){return !t.failed&&t.eth>0}const baseline=()=>new Set(rows.filter(t=>t.hour<12&&valid(t)).map(t=>t.to));
function visible(){return rows.filter(t=>t.hour<12||t.hour<=12+s.cursor)}
function matched(){const c=12+s.cursor;return visible().filter(t=>t.hour>=Math.max(12,c-s.window)&&t.hour<=c&&valid(t)&&t.eth>=s.min&&!baseline().has(t.to))}
function count(){return new Set(matched().map(t=>t.to)).size}function hit(){return count()>=s.k}function historyHit(){return Array.from({length:s.cursor+1},(_,i)=>12+i).some(c=>new Set(rows.filter(t=>t.hour>=Math.max(12,c-s.window)&&t.hour<=c&&valid(t)&&t.eth>=s.min&&!baseline().has(t.to)).map(t=>t.to)).size>=s.k)}
function focusName(){return s.focus==='expand'?'新增接收方是否重复出现':'原接收方的活动是否改变'}
function graph(){const confirmed=s.stage>=2,trigger=confirmed&&historyHit();return `<div class="graphscroll"><svg viewBox="0 0 650 330" role="img" aria-label="研究问题、旧理由、观察条件与交易证据关系图"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="#879884"/></marker></defs><path class="edge" d="M180 85 L250 55 M180 85 L250 150 M420 150 L470 150" marker-end="url(#arrow)"/><rect class="node" x="10" y="50" width="170" height="75" rx="8"/><text x="24" y="77">我的判断 · v${s.reviews.length+1}</text><text data-user x="24" y="100">${esc(s.stance.slice(0,22))}</text><rect class="node" x="250" y="20" width="330" height="66" rx="8"/><text data-user x="266" y="46">${esc(s.reason.slice(0,42))}</text><text x="266" y="68">${s.memory?'个人语境已关联':'个人语境暂不提供给本次复核'}</text><rect class="node" x="250" y="115" width="170" height="72" rx="8"/><text x="264" y="142">${confirmed?'已确认观察条件':'待确认观察条件'}</text><text x="264" y="164">${confirmed?`${s.k} 个不同新接收方`:'由你决定何时回来'}</text>${confirmed?`<rect class="node" x="470" y="115" width="170" height="72" rx="8"/><text x="484" y="142">已验证：${count()} 个 / ${s.k}</text><text x="484" y="164">${trigger?'已有告警 · 待复核':'条件尚未满足'}</text><path class="edge ${trigger?'new':''}" d="M550 187 L550 235 L180 235 L180 125" marker-end="url(#arrow)"/><text x="260" y="225">${trigger?'新证据触发复核，未自动改判':'历史证据逐步揭示'}</text><rect class="node" x="35" y="266" width="570" height="48" rx="8"/><text x="50" y="295">下一步：${s.memory?esc(focusName()):'先查本窗口转出明细（不读取私人理由）'}</text>`:'<text x="30" y="235">理解确认后，条件和证据关系会继续长出来。</text>'}</svg></div>`}
function render(){document.getElementById('steps').innerHTML=['01 贴材料','02 确认理解','03 条件与回放','04 复核与保存'].map((t,i)=>`<div class="step ${s.stage>=i?'active':''}">${t}</div>`).join('');let html='';
if(s.stage===0)html=`<section class="card"><h2>先说说，你停在了哪里？</h2><p>贴一段笔记，或从示例开始。此原型不理解任意文本；下一步请亲自编辑、确认理解卡。</p><label class="label" for="note">我的研究材料</label><textarea id="note" style="min-height:155px">${esc(s.note)}</textarea><div class="actions"><button id="example">填入示例</button><button class="primary" id="understand">整理我的前情 →</button></div></section>`;
if(s.stage===1)html=`<div class="layout"><section class="card"><span class="pill">模拟 AI 草稿 · 未确认</span><h2>我先确认，有没有理解对。</h2><p>你注意到接收方变化，但证据不足以解释它。先把观察和推测分开，确认后再开始观察。</p><label class="label" for="stance">当前看法（可纠正）</label><input id="stance" value="${esc(s.stance)}"><label class="label" for="reason">为什么停下（可纠正）</label><textarea id="reason">${esc(s.reason)}</textarea><details><summary>查看原始材料</summary><p data-user>${esc(s.note)}</p></details><label class="label" for="focus">回来以后，你更想先解决哪一问？</label><select id="focus"><option value="expand" ${s.focus==='expand'?'selected':''}>新增接收方后来有没有重复出现？</option><option value="known" ${s.focus==='known'?'selected':''}>原来那组接收方的活动有没有改变？</option></select><div class="actions"><button id="back">返回修改材料</button><button class="primary" id="confirmContext">这符合我的意思 →</button></div></section><section class="card"><h2>前情正在连起来</h2>${graph()}<small>此图为结构预览。你的原文与编辑结果在确认后成为当前研究语境。</small></section></div>`;
if(s.stage>=2){html=`<div class="layout"><section class="card full"><div class="modebar"><div><span class="pill">2026-09-01 · 合成回放</span><h2>同一份证据，两种继续研究的方式。</h2></div><button id="memory" aria-pressed="${s.memory}">个人记忆：${s.memory?'开':'关'} · 点击对照</button></div><p>${s.memory?'本次复核会读取已确认的个人理由与未解问题。':'本次复核不读取私人笔记。规则、交易、告警与计算全部保留。'}</p>${graph()}</section><section class="card"><h2>你确认的观察条件</h2><p>观察 A 向<strong>基线内未见</strong>的不同接收方转出 ETH。基线：08:00–12:00（不含12:00），已见 B、C。</p><div class="split"><label>不同接收方数<input id="k" type="number" min="1" max="20" value="${s.k}"></label><label>滚动小时窗<input id="window" type="number" min="1" max="24" value="${s.window}"></label><label>单笔最低 ETH<input id="min" type="number" min="0" step="0.1" value="${s.min}"></label></div><div class="actions"><button id="apply">确认条件并从12:00重放</button><button id="editContext">修改研究语境</button></div><small>只有成功、正值、由A发出的外层交易计入；本例不模拟代币／内部转账。参数是演示设置，不是风险标准。</small></section><section class="card"><h2>回放至 ${12+s.cursor}:00 UTC</h2><div class="split"><div class="fact"><b>${count()}</b>本窗口不同新接收方</div><div class="fact"><b>${visible().length}</b>已揭示交易（含基线）</div><div class="fact"><b>${historyHit()?'有':'无'}</b>已触发的告警</div></div><div class="actions"><button id="previous" ${s.cursor===0?'disabled':''}>← 上一小时</button><button class="primary" id="next" ${s.cursor===5?'disabled':''}>下一小时 →</button></div><p class="status">${historyHit()?(hit()?'规则已触发 · 等待你的复核':'之前已触发；当前窗口已低于阈值，旧事件仍可复核'):'观察中 · 已载范围内条件尚未满足'}</p><small>不同模式的触发结果相同。D、E首次出现于13:00、14:00；后续是否再出现，须推进时间才能知道。</small></section><section class="card full"><h2>可检查的交易记录</h2><div class="scroll"><table><thead><tr><th>模拟ID</th><th>UTC时间</th><th>方向</th><th>ETH</th><th>规则说明</th></tr></thead><tbody>${visible().map(t=>`<tr><td>${t.id}</td><td>${t.hour}:00</td><td>A → ${t.to}</td><td>${t.eth}</td><td>${t.hour<12?'基线记录':t.failed?'失败，不计入':baseline().has(t.to)?'基线已见，不计入':t.eth<s.min?'低于单笔门槛':matched().some(r=>r.id===t.id)?'本窗口符合':'窗口外，保留记录'}</td></tr>`).join('')}</tbody></table></div><small>模拟ID不是链上哈希，不能用于区块浏览器验真。全部8条记录均为本文件内合成数据。</small></section>`;
if(historyHit()){s.stage=3;html+=`<section class="card alert full"><span class="pill">两种模式都有此告警</span><h2>观察条件曾被满足。接下来查什么？</h2><div class="layout"><div><h3>${s.memory?'与你上次问题的连接':'不带个人记忆的通用复核'}</h3>${s.memory?`<p>你确认的看法：<strong data-user>${esc(s.stance)}</strong></p><p>暂停原因：<span data-user>${esc(s.reason)}</span></p><p>未解问题：${esc(focusName())}。转账记录仍不能证明地址归属或意图。</p><details><summary>引用的个人材料</summary><p data-user>${esc(s.note)}</p><small>来源：你在步骤1输入、步骤2编辑确认的研究卡。</small></details>`:'<p>规则命中说明出现了符合参数的交易。没有个人语境，系统不知道你为什么在意，也不会编造私人理由。</p>'}<h3>建议下一步</h3><p>${s.memory?(s.focus==='expand'?'检查新接收方D、E在已揭示记录中是否再次出现。':'对比原接收方B、C在基线和后续的活动。'):'先查看当前窗口成功转出明细，确定金额与笔数，再由你决定研究方向。'}</p><button class="primary" id="runCheck">执行${s.memory?'与我的问题相关的':'通用'}检查</button></div><div><h3>试试公平对照</h3><p>切换记忆开关，告警不消失、交易不改变。再次点击执行，检查对象和结果表会改变。</p><p>记忆开启时，也可返回修改未解问题；同一批交易会对应另一项检查。</p><small>这是本地模板驱动的交互假设，不证明真实AI已经具备这种能力。</small></div></div><div id="checkResult">${s.check?checkHTML():''}</div></section><section class="card full"><h2>现在由你作判断</h2><p>条件触发不意味着原猜测成立。你可以维持看法，也可以继续等证据。</p><label class="label" for="outcome">我的复核结果</label><select id="outcome"><option>维持原看法</option><option>修改看法</option><option>还需要更多证据</option></select><label class="label" for="reviewStance">复核后的看法（可编辑）</label><input id="reviewStance" value="${esc(s.stance)}"><label class="label" for="rationale">复核理由（会保存为新版本）</label><textarea id="rationale" placeholder="看完检查结果后，写下你的理由。系统不会替你认定在累积或派发。"></textarea><div class="actions"><button class="primary" id="saveReview" ${!s.check?'disabled':''}>确认并保存复核</button><button id="export">导出研究简报</button></div><small>请先执行当前模式的检查。保存后可刷新验证；如需新观察条件，可在上方确认参数并重放。</small>${s.reviews.map((r,i)=>`<div class="version"><b>v${i+2} · ${esc(r.outcome)}</b><p data-user>${esc(r.rationale)}</p><small>${esc(r.time)} · 回放${r.cursor}:00 · ${r.memory?'有个人记忆':'无个人记忆'} · ${esc(r.check)}</small></div>`).join('')}</section>`}
html+='</div>'}
document.getElementById('app').innerHTML=html;bind();save();}
function checkHTML(){if(!s.check)return '';const c=s.check;return `<div class="result"><h3>${esc(c.title)}</h3><p>${esc(c.explanation)}</p><div class="scroll"><table><thead><tr>${c.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${c.data.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><small>计算截至 ${c.cursor}:00 UTC；仅使用当时已揭示记录。${esc(c.sources)}</small></div>`}
function execute(){const v=visible(),later=v.filter(t=>t.hour>=12&&valid(t));if(!s.memory){const a=later.filter(t=>t.hour>=Math.max(12,12+s.cursor-s.window));s.check={title:'通用检查：当前窗口成功转出明细',explanation:'只报告可观察事实，不读取私人理由、不推断交易目的。',head:['记录','时间','接收方','ETH'],data:a.map(t=>[t.id,t.hour+':00',t.to,t.eth]),sources:'来源：当前窗口成功的合成记录。',cursor:12+s.cursor}}
else if(s.focus==='expand'){const targets=[...new Set(later.filter(t=>!baseline().has(t.to)).map(t=>t.to))];s.check={title:'个人检查：新增接收方有没有再次出现？',explanation:'你先前说孤立新增不足以下结论，因此先检查复现。次数不足只是尚未观察到，不证明以后不会发生。',head:['接收方','已见笔数','是否已重复','记录来源'],data:targets.map(to=>{const a=later.filter(t=>t.to===to);return[to,a.length,a.length>1?'是':'暂未',a.map(t=>t.id).join(', ')]}),sources:'相对08:00–12:00基线；观察窗口内首次出现的D、E。',cursor:12+s.cursor}}
else{s.check={title:'个人检查：原接收方集合的前后活动',explanation:'你关心原有模式是否变化，因此先查B、C。基线与后续时长不同，原始总量不能直接当成活动速率下降。',head:['接收方','基线笔数 / ETH','后续笔数 / ETH','来源'],data:[...baseline()].map(to=>{const a=v.filter(t=>t.hour<12&&valid(t)&&t.to===to),b=later.filter(t=>t.to===to);return[to,`${a.length} / ${a.reduce((x,t)=>x+t.eth,0)}`,`${b.length} / ${b.reduce((x,t)=>x+t.eth,0)}`,[...a,...b].map(t=>t.id).join(', ')]}),sources:'来源：基线及截至当前时刻的成功合成交易。',cursor:12+s.cursor}}render();document.getElementById('checkResult').scrollIntoView({block:'center',behavior:'smooth'});}
function on(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn}
function bind(){on('example',()=>{document.getElementById('note').value=seedNote});on('understand',()=>{const v=document.getElementById('note').value.trim();if(!v)return toast('请先贴一段材料，或填入示例。');s.note=v;s.stage=1;render()});on('back',()=>{s.stage=0;render()});on('confirmContext',()=>{const a=document.getElementById('stance').value.trim(),b=document.getElementById('reason').value.trim();if(!a||!b)return toast('请确认看法和暂停原因。');s.stance=a;s.reason=b;s.focus=document.getElementById('focus').value;s.stage=2;s.cursor=0;s.check=null;render()});on('editContext',()=>{s.stage=1;s.check=null;render()});on('apply',()=>{const k=Number(document.getElementById('k').value),w=Number(document.getElementById('window').value),m=Number(document.getElementById('min').value);if(!Number.isInteger(k)||k<1||k>20||!Number.isInteger(w)||w<1||w>24||!Number.isFinite(m)||m<0)return toast('数量需为1–20整数，时间窗1–24整数小时，最低金额不得为负。');s.k=k;s.window=w;s.min=m;s.cursor=0;s.stage=2;s.check=null;render();toast('条件已确认；当前回放回到12:00。已保存复核仍保留。')});on('next',()=>{s.cursor=Math.min(5,s.cursor+1);s.check=null;render()});on('previous',()=>{s.cursor=Math.max(0,s.cursor-1);s.stage=2;s.check=null;render()});on('memory',()=>{s.memory=!s.memory;s.check=null;render()});on('runCheck',execute);on('saveReview',()=>{const text=document.getElementById('rationale').value.trim(),newStance=document.getElementById('reviewStance').value.trim();if(!newStance)return toast('请填写复核后的看法。');if(!text)return toast('请写下自己的复核理由，再保存。');s.reviews.push({outcome:document.getElementById('outcome').value,rationale:text,time:new Date().toLocaleString('zh-CN'),cursor:12+s.cursor,memory:s.memory,check:s.check.title,evidence:JSON.parse(JSON.stringify(s.check)),context:{note:s.note,stance:s.stance,reason:s.reason,focus:s.focus},rule:{k:s.k,window:s.window,min:s.min},confirmedStance:newStance});s.stance=newStance;s.reason=text;render();toast('已保存新复核版本。可以刷新检查。')});on('export',()=>{const text=`# ChainThread Research Brief\n\nSynthetic records and simulated AI; not live on-chain analysis.\n\n## Original notes\n${s.note}\n\n## Confirmed context\n${s.stance}\n${s.reason}\n未解问题：${focusName()}\n\n## Watch condition\n基线08:00–12:00，${s.window}小时内${s.k}个不同新接收方，单笔≥${s.min} ETH。当前${12+s.cursor}:00 UTC。\n\n## Review history\n${s.reviews.map((r,i)=>`### v${i+2} ${r.outcome}\n${r.rationale}\n${r.check}\n时刻${r.cursor}:00\n\n检查结果：\n${JSON.stringify(r.evidence,null,2)}\n\n当时语境与规则：\n${JSON.stringify({context:r.context,rule:r.rule},null,2)}`).join('\n\n')}`;const u=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='lifechain-research-brief.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})}
document.getElementById('reset').onclick=()=>document.getElementById('resetDialog').showModal();document.getElementById('cancelReset').onclick=()=>document.getElementById('resetDialog').close();document.getElementById('confirmReset').onclick=()=>{s=initial();save();document.getElementById('resetDialog').close();render();toast('已恢复种子材料、记忆开启和初始时间。')};render();
</script></html>
