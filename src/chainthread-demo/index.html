<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChainThread · Research desk</title><style>
:root{--paper:#f5f1e8;--ink:#29362e;--line:#d5d8ca;--green:#315c49}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Georgia,'Songti SC',serif}header{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px}.brand{font-size:30px}main{max-width:1120px;margin:auto;padding:32px 24px}h1{font-size:44px;line-height:1.2;font-weight:400}h2{font-size:24px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fffef9;border:1px solid var(--line);padding:24px;margin:20px 0}.notice{padding:13px 18px;border-left:3px solid #ac742c;background:#eee7d7;font:13px/1.6 sans-serif}label{display:block;margin:15px 0 5px}textarea,input,select{width:100%;padding:12px;border:1px solid #aebaaa;background:white;color:var(--ink);font:15px/1.5 sans-serif}textarea{min-height:100px}button{cursor:pointer;font:14px/1.5 sans-serif;padding:11px 17px;background:#fffef9;border:1px solid var(--line);color:var(--ink);margin:8px 5px 8px 0}button.primary{background:var(--green);color:white}button:disabled{opacity:.5;cursor:wait}small,.muted{color:#6b756a;font:13px/1.6 sans-serif}.pill{border:1px solid var(--line);padding:4px 10px;font:12px sans-serif}table{border-collapse:collapse;width:100%;font:12px/1.5 monospace}td,th{text-align:left;border-bottom:1px solid var(--line);padding:10px 6px}a{color:var(--green)}.scroll{overflow:auto}.version{border-left:2px solid var(--green);padding:0 0 16px 16px}.error{color:#a13420;white-space:pre-wrap}#status{position:sticky;bottom:10px;background:#29362e;color:white;padding:10px 20px;display:none;font:14px sans-serif}pre{white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere}.full{grid-column:1/-1}@media(max-width:750px){.grid{display:block}h1{font-size:32px}}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bc873c;outline-offset:2px}</style>
<header><div class="brand">Chain<span style="color:#50735b">Thread</span></div><span class="pill">ETHEREUM / RESEARCH DESK</span><button id="lang" style="margin-left:auto">中文</button></header><main><small>ONE QUESTION. TRACEABLE EVIDENCE. YOUR DECISION.</small><h1 id="title"></h1><div class="notice" id="disclosure"></div><div id="error" class="error" role="alert"></div><div class="grid"><section class="card"><h2 id="noteTitle"></h2><label id="noteLabel" for="note"></label><textarea id="note"></textarea><label id="standardLabel" for="standard"></label><textarea id="standard"></textarea><p><label><input id="approve" type="checkbox" style="width:auto"> <span id="approveText"></span></label></p><button class="primary" id="confirm"></button><p class="muted" id="memoryStatus"></p></section><section class="card"><h2 id="evidenceTitle"></h2><p class="muted" id="source"></p><p id="facts"></p><div class="scroll"><table><thead><tr><th>UTC</th><th>ETH ≈</th><th id="recipientHeading"></th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table></div><details><summary id="queryTitle"></summary><pre id="query"></pre></details></section><section class="card full"><h2 id="checkTitle"></h2><p id="checkHelp"></p><button class="primary" id="analyze"></button><div id="analysis"></div></section><section class="card"><h2 id="historyTitle"></h2><div id="history"></div><button id="export"></button></section><section class="card"><h2 id="providerTitle"></h2><p class="muted" id="providerHelp"></p><label for="model">NVIDIA model ID</label><input id="model" value="nvidia/nemotron-3.5-lightning-30b-a3b"><label for="key">NVIDIA API key</label><input id="key" type="password" autocomplete="off" placeholder="nvapi-…"><button id="saveProvider"></button><p class="muted" id="providerStatus"></p></section></div><div id="status" role="status"></div></main><script>
let lang='en',state;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tr=(en,zh)=>lang==='en'?en:zh;
async function api(url,body){const r=await fetch('/api/'+url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const result=await r.json();if(!r.ok)throw Error(result.error);return result;}
async function action(button,fn){button.disabled=true;$('error').textContent='';$('status').style.display='block';$('status').textContent=tr('Working… Model requests can take up to two minutes.','处理中……模型调用最多等待两分钟。');try{await fn()}catch(e){$('error').textContent=e.message}finally{button.disabled=false;$('status').style.display='none'}}
function copy(){const labels={title:['Before you change your mind, check the evidence.','重新判断之前，先核对证据。'],disclosure:['Real Zetaris query snapshot · 1 September 2026 historical ETH data. H-MEM persists human-confirmed notes. AI calls NVIDIA directly; Nightshift is NOT integrated. This is a local prototype, not a live monitoring service.','真实 Zetaris 查询快照 · 2026年9月1日 ETH 历史数据。H-MEM 保存人工确认的笔记。AI 暂时直连 NVIDIA，未接入 Nightshift。本地原型，不是实时监控服务。'],noteTitle:['01 / Your unfinished research','01 / 你尚未完成的研究'],noteLabel:['What did you conclude, and why did you pause?','你的暂时判断是什么，为什么暂停？'],standardLabel:['What evidence would be enough to reconsider?','什么证据足以让你重新判断？'],approveText:['I confirm this note and evidence standard.','我确认这份研究笔记与证据标准。'],confirm:['Confirm & save to H-MEM','确认并写入 H-MEM'],evidenceTitle:['02 / The actual transactions','02 / 实际交易证据'],recipientHeading:['Recipient','接收方'],queryTitle:['Inspect original SQL','查看原始 SQL'],checkTitle:['03 / Check against my standard','03 / 按我的证据标准复核'],checkHelp:['The model receives the same five transactions plus your confirmed H-MEM record. Its answer stays advisory. Edit the note above and explicitly confirm to record your final judgment as a new version.','模型收到这五笔交易和你已确认的 H-MEM 记录。回答只是建议。你可以修改上方笔记，再明确确认，把最终判断存为新版本。'],analyze:['Run evidence check','运行证据检查'],historyTitle:['04 / Confirmed judgment history','04 / 已确认的判断历史'],export:['Export research record','导出研究记录'],providerTitle:['Model connection','模型连接'],providerHelp:['Temporary direct NVIDIA connection. Key stays in a private local server file; it is never included in exports. Fill it here, not in chat.','临时直连 NVIDIA。密钥保存在本机私有服务端文件，不会写入导出记录。请在这里填写，不要发到聊天里。'],saveProvider:['Save local connection','保存本机连接']};for(const [id,v]of Object.entries(labels))$(id).textContent=v[lang==='en'?0:1];$('lang').textContent=tr('中文','English');document.documentElement.lang=lang==='en'?'en':'zh-CN';}
function render(){copy();if(state.configuredModel)$('model').value=state.configuredModel;const f=state.facts;$('source').textContent=tr('Queried from local Zetaris at ','本机 Zetaris 查询完成于 ')+f.source.completed_at+' · UTC';$('query').textContent=f.source.sql;$('facts').textContent=tr('5 successful direct ETH transfers. Two baseline recipients; two recipients absent from that baseline. One receives twice, 41 minutes apart. Ownership and purpose remain unknown.','5笔成功的直接 ETH 转账。基线有两个接收方；观察段有两个基线中未见的接收方，其中一个收到两笔，间隔41分钟。归属与用途仍未知。');$('rows').innerHTML=f.rows.map(r=>`<tr><td>${esc(r.block_timestamp.slice(11,19))}</td><td>${Number(r.value)/1e18}</td><td title="${esc(r.recipient)}">${esc(r.recipient.slice(0,8)+'…'+r.recipient.slice(-4))}</td><td><a href="https://etherscan.io/tx/${r.hash}" target="_blank" rel="noreferrer">${esc(r.hash.slice(0,10))}↗</a></td></tr>`).join('');$('providerStatus').textContent=state.providerConfigured?tr('Configured locally. A successful model request still needs verification.','本机已配置，仍需通过一次真实调用验证。'):tr('Not configured yet.','尚未配置。');$('memoryStatus').textContent=state.versions.length?tr('Confirmed versions: ','已确认版本：')+state.versions.length+' · '+state.versions.at(-1).id:tr('Draft only. Nothing has been written to memory.','当前只是草稿，尚未写入记忆。');$('history').innerHTML=state.versions.slice().reverse().map(v=>`<div class="version"><small>${esc(v.at)} · ${esc(v.id)}</small><p>${esc(v.note)}</p><p>${esc(v.standard)}</p><small>${v.supersedes?tr('Supersedes ','取代 ')+esc(v.supersedes):tr('First confirmed version','首次确认版本')}</small></div>`).join('');const a=state.analyses.at(-1);$('analysis').innerHTML=a?`<div class="card"><small>${esc(a.model)} · ${esc(a.at)}<br>H-MEM ${esc(a.memoryId)}</small><p class="notice">${tr("AI draft — citation links are checked, but interpretation still requires your review.","AI 草稿：引用链接已校验，解释仍需人工复核。")}</p>${(a.qualityNotes||[]).map(x=>`<p class="notice">${esc(x)}</p>`).join('')}<h3>${esc(a.answer.summary)}</h3>${a.answer.supported_claims.map(c=>`<p>${esc(c.claim)}<br>${c.hashes.map(h=>`<a href="https://etherscan.io/tx/${h}" target="_blank" rel="noreferrer">${esc(h.slice(0,14))}↗</a>`).join(' ')}</p>`).join('')}<h3>${tr('Next check','下一步检查')}</h3><p>${esc(a.answer.next_check)}</p><ul>${a.answer.limitations.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><details><summary>${tr('Inspect memory injected into this request','检查本次调用注入的记忆')}</summary><pre>${esc(a.retrieval)}</pre></details>${a.memoryId!==state.versions.at(-1)?.id?'<p class="notice">'+tr('This analysis used an earlier note. Run the check again for the current version.','此分析使用了旧版本笔记，请重新运行以检查当前版本。')+'</p>':''}</div>`:'';}
async function load(){state=await api('state');render()}
$('lang').onclick=()=>{lang=lang==='en'?'zh':'en';render()};$('confirm').onclick=()=>action($('confirm'),async()=>{await api('confirm',{note:$('note').value,standard:$('standard').value,approved:$('approve').checked});$('approve').checked=false;await load()});$('analyze').onclick=()=>action($('analyze'),async()=>{await api('analyze',{language:lang});await load()});$('saveProvider').onclick=()=>action($('saveProvider'),async()=>{await api('config',{base:'https://integrate.api.nvidia.com/v1',key:$('key').value,model:$('model').value});$('key').value='';await load()});$('export').onclick=()=>action($('export'),async()=>{const record=await api('export',{}),url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='chainthread-research.json';a.click();URL.revokeObjectURL(url)});
load().then(()=>{const v=state.versions.at(-1);$('note').value=v?.note||'I paused this investigation because a few transfers do not establish a sustained relationship. Recipient ownership is unknown.';$('standard').value=v?.standard||'I want evidence of continued interaction over time before treating this as a sustained relationship. Do not treat two transfers in a short interval as sufficient by themselves.'}).catch(e=>$('error').textContent=e.message);
</script></html>
